[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Route /api/cosmo to the Netlify serverless function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# SPA fallback routing for client-side navigation
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
